<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jungle City — Admin Login</title>
  <style>
    body { font-family: system-ui, Arial; margin: 40px auto; max-width: 600px; background: #f5f5f5; }
    .container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
    h1 { color: #0ea15a; margin-bottom: 10px; }
    p { color: #666; margin-bottom: 30px; }
    button { padding: 12px 24px; font-size: 16px; background: #0ea15a; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0d8d4a; }
    .error { color: #d32f2f; background: #ffebee; padding: 12px; border-radius: 4px; margin-bottom: 20px; }
    a { color: #0ea15a; text-decoration: none; margin: 0 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Jungle City — Admin</h1>
    <p>Sign in with your GitHub account to manage and edit the website.</p>
    <div id="content"></div>
  </div>

  <script>
    async function init() {
      const r = await fetch('/api/oauth-config').catch(() => ({ ok: false }));
      const cfg = r.ok ? await r.json() : {};
      const clientId = cfg.client_id;
      const redirect = location.origin + '/api/oauth-callback';
      const authUrl = `https://github.com/login/oauth/authorize?client_id=${encodeURIComponent(clientId)}&scope=repo&redirect_uri=${encodeURIComponent(redirect)}`;
      const container = document.getElementById('content');

      if (!clientId) {
        container.innerHTML = `
          <div class="error">
            <strong>OAuth not configured</strong><br>
            Set GITHUB_OAUTH_CLIENT_ID and GITHUB_OAUTH_CLIENT_SECRET in environment variables.<br>
            See <a href="/admin/README.md" target="_blank">admin/README.md</a> for setup instructions.
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <p><a href="${authUrl}"><button>🔐 Login with GitHub</button></a></p>
        <p><a href="/admin/dashboard.html">Open Dashboard (if already authenticated)</a></p>
      `;
    }
    init();
  </script>
</body>
</html>
