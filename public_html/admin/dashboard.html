<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jungle City — Admin Dashboard</title>
  <style>body{font-family:system-ui,Arial;margin:18px}textarea{width:100%;height:320px;font-family:monospace}input,button{padding:8px}</style>
</head>
<body>
  <h1>Admin Dashboard</h1>
  <p>Use this UI to edit files (path relative to repo) and upload images. Login via the <a href="/admin">Admin login</a> if needed.</p>

  <section>
    <h2>Edit file</h2>
    <label>File path: <input id="filePath" value="public_html/index.html" style="width:60%"></label>
    <p><button id="loadBtn">Load</button> <button id="saveBtn">Save (commit)</button></p>
    <textarea id="editor"></textarea>
    <p id="status"></p>
  </section>

  <section>
    <h2>Upload image</h2>
    <input type="file" id="imageInput" accept="image/*"><br><br>
    <label>Filename (optional): <input id="imageName" placeholder="keep original"></label>
    <p><button id="uploadBtn">Upload</button></p>
    <p id="uploadStatus"></p>
  </section>

  <script>
    async function jsonReq(url, opts){
      const r = await fetch(url, opts);
      try { return await r.json(); } catch(e){ return { ok: r.ok, status: r.status } }
    }

    document.getElementById('loadBtn').addEventListener('click', async ()=>{
      const path = document.getElementById('filePath').value.trim();
      if (!path) return alert('Enter path');
      const r = await fetch(`https://raw.githubusercontent.com/${(await (await fetch('/api/oauth-config')).json()).repo}/main/${path}`);
      if (!r.ok) return document.getElementById('status').textContent = 'Failed to load file (not found or access)';
      const txt = await r.text();
      document.getElementById('editor').value = txt;
      document.getElementById('status').textContent = 'Loaded.';
    });

    document.getElementById('saveBtn').addEventListener('click', async ()=>{
      const path = document.getElementById('filePath').value.trim();
      const content = document.getElementById('editor').value;
      if (!path) return alert('Enter path');
      document.getElementById('status').textContent = 'Saving...';
      const res = await jsonReq('/api/gh-commit', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ path, content, message: `Admin edit: ${path}` }) });
      document.getElementById('status').textContent = res.ok ? 'Saved.' : ('Error: ' + (res.message || JSON.stringify(res)));
    });

    document.getElementById('uploadBtn').addEventListener('click', async ()=>{
      const input = document.getElementById('imageInput');
      if (!input.files || !input.files[0]) return alert('Pick a file');
      const file = input.files[0];
      const name = document.getElementById('imageName').value.trim() || file.name;
      const reader = new FileReader();
      reader.onload = async ()=>{
        const base64 = reader.result.split(',')[1];
        document.getElementById('uploadStatus').textContent = 'Uploading...';
        const res = await jsonReq('/api/gh-upload', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ filename: name, content_base64: base64, message: `Admin upload: ${name}` }) });
        if (res.ok) document.getElementById('uploadStatus').innerHTML = `Uploaded: <a href="${res.url}" target="_blank">${res.url}</a>`;
        else document.getElementById('uploadStatus').textContent = 'Upload failed: ' + JSON.stringify(res);
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
